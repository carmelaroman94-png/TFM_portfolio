[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inflacion"
version = "0.1.0"
description = "Multicausalidad de la inflación: perfiles monetario-fiscales y heterogeneidad de trayectorias (2000-2020)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
